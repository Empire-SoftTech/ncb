<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }

  .og {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: stretch;
    position: relative;
    overflow: hidden;
    background: #0F172A;
  }

  /* full background gradient */
  .og-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 45%, #2563EB 100%);
    z-index: 0;
  }

  /* decorative circles */
  .circle-1 {
    position: absolute; border-radius: 50%;
    width: 520px; height: 520px;
    background: rgba(255,255,255,.05);
    top: -180px; right: -60px; z-index: 0;
  }
  .circle-2 {
    position: absolute; border-radius: 50%;
    width: 280px; height: 280px;
    background: rgba(255,255,255,.04);
    bottom: -100px; left: 380px; z-index: 0;
  }
  .circle-3 {
    position: absolute; border-radius: 50%;
    width: 120px; height: 120px;
    background: rgba(96,165,250,.12);
    top: 60px; right: 300px; z-index: 0;
  }

  /* left panel */
  .left {
    width: 340px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .logo-wrap {
    position: relative;
  }
  .logo-img {
    width: 210px; height: 210px;
    border-radius: 42px;
    display: block;
    box-shadow: 0 32px 80px rgba(0,0,0,.55),
                0 0 0 1px rgba(255,255,255,.1);
  }
  /* glow behind logo */
  .logo-glow {
    position: absolute;
    inset: -24px;
    border-radius: 60px;
    background: radial-gradient(ellipse, rgba(37,99,235,.4) 0%, transparent 70%);
    z-index: -1;
  }

  /* right panel */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 70px 0 24px;
    position: relative;
    z-index: 1;
  }

  .app-name {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 12px;
  }
  .app-name span { color: #60A5FA; }

  .tagline {
    font-size: 26px;
    font-weight: 700;
    color: #60A5FA;
    margin-bottom: 18px;
    letter-spacing: .2px;
  }

  .desc {
    font-size: 19px;
    color: rgba(255,255,255,.62);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 580px;
  }

  .pills {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .pill {
    padding: 8px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.88);
    font-size: 15px;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
    color: #fff;
    border-radius: 16px;
    padding: 16px 36px;
    font-size: 20px;
    font-weight: 700;
    width: fit-content;
    box-shadow: 0 12px 30px rgba(37,99,235,.55);
    border: 1.5px solid rgba(255,255,255,.2);
  }
  .cta-icon { font-size: 22px; }

  .domain {
    position: absolute;
    bottom: 30px; right: 52px;
    font-size: 16px;
    color: rgba(255,255,255,.28);
    letter-spacing: .8px;
    z-index: 1;
  }

  /* rating strip */
  .rating {
    position: absolute;
    bottom: 30px; left: 340px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 1;
  }
  .stars { color: #FBBF24; font-size: 18px; }
  .rating-text { color: rgba(255,255,255,.45); font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
<div class="og">
  <div class="og-bg"></div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>

  <div class="left">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img class="logo-img" src="android-chrome-512x512.png" alt="NextCV – AI Resume Builder app icon" width="210" height="210"/>
    </div>
  </div>

  <div class="right">
    <div class="app-name">Next<span>CV</span></div>
    <div class="tagline">AI Resume Builder &amp; ATS Creator</div>
    <div class="desc">
      Create professional ATS-friendly resumes in minutes.<br/>
      AI suggestions &nbsp;·&nbsp; Pro Templates &nbsp;·&nbsp; Instant PDF Export
    </div>
    <div class="pills">
      <span class="pill">🤖 AI-Powered</span>
      <span class="pill">✅ ATS-Friendly</span>
      <span class="pill">📄 PDF Export</span>
      <span class="pill">🆓 Free Download</span>
    </div>
    <div class="cta">
      <span class="cta-icon">▶</span> Download Free on Google Play
    </div>
  </div>

  <div class="domain">nextcvbuilder.online</div>
  <div class="rating">
    <span class="stars">★★★★★</span>
    <span class="rating-text">4.8 · 10+ Downloads</span>
  </div>
</div>
</body>
</html>
